services:
  db:
    image: postgres:15-alpine
    container_name: bugtracker-db
    environment:
      POSTGRES_DB: bugtracker
      POSTGRES_USER: bugtracker
      POSTGRES_PASSWORD: bugtracker123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugtracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bugtracker-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugtracker-backend
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/bugtracker
      DB_USERNAME: bugtracker
      DB_PASSWORD: bugtracker123
      DB_DDL_AUTO: update
      DB_SHOW_SQL: false
      SERVER_PORT: 8081
      LOG_LEVEL: INFO
    networks:
      - bugtracker-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bugtracker-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_URL: /api
    networks:
      - bugtracker-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: bugtracker_postgres_data

networks:
  bugtracker-network:
    name: bugtracker_network
    driver: bridge