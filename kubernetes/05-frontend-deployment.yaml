apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bugtracker
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - port: 3000        # Service'in dinlediği port
    targetPort: 3000  # Pod'un dinlediği port
  type: ClusterIP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bugtracker
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: dscc86y/bugtracker-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000     # Container içinde Nginx'in (fe uygulaması) dinlediği  port
        env:
        - name: VITE_API_URL
          value: "/api"
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5