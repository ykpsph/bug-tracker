apiVersion: v1
kind: Service       # service 
metadata:
  name: backend
  namespace: bugtracker
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - port: 8081
    targetPort: 8081
  type: ClusterIP

---

apiVersion: apps/v1
kind: Deployment      # deployment
metadata:
  name: backend
  namespace: bugtracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: dscc86y/bugtracker-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081    # container içinde backend uygulamasının dinlediği port
        env: 
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: bugtracker-secrets
              key: DB_URL
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: bugtracker-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bugtracker-secrets
              key: DB_PASSWORD
        - name: DB_DDL_AUTO
          valueFrom:
            configMapKeyRef:
              name: bugtracker-config
              key: DB_DDL_AUTO
        - name: DB_SHOW_SQL
          valueFrom:
            configMapKeyRef:
              name: bugtracker-config
              key: DB_SHOW_SQL
        - name: SERVER_PORT
          value: "8081"
          # İSİM DEĞİŞİKLİĞİ: Spring Boot'un k8s profilini kesin okuması için standart env adı eklendi
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: bugtracker-config
              key: SPRING_PROFILES_ACTIVE
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: bugtracker-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/bugs
            port: 8081
          initialDelaySeconds: 90 # 30'dan 90 saniyeye çıkarıldı çünkü backend uygulaması başlatılırken PostgreSQL'in hazır olmasını beklemek için daha uzun bir süreye ihtiyaç duyuyor. 34 sn falan
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/bugs
            port: 8081
          initialDelaySeconds: 60 # aynı şekilde, backend uygulamasının PostgreSQL'e bağlanabilmesi için daha uzun bir süreye ihtiyaç duyuyor.
          periodSeconds: 5